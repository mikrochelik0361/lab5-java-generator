# ============================================================
# ФОРМАЛЬНАЯ СПЕЦИФИКАЦИЯ МОДУЛЯ Calculator
# ============================================================
# Этот файл описывает:
# - Функциональные требования (что делает модуль)
# - Нефункциональные требования (ограничения)
# - Классы эквивалентности (граничные случаи)
# - Предусловия (pre) — что должно быть ДО вызова
# - Постусловия (post) — что должно быть ПОСЛЕ вызова
# ============================================================

module: Calculator

# -----------------------------------------------------------
# НЕФУНКЦИОНАЛЬНЫЕ ТРЕБОВАНИЯ (ограничения системы)
# -----------------------------------------------------------
non_functional_requirements:
  - id: NFR-1
    desc: "Результат сложения не превышает Integer.MAX_VALUE (2_147_483_647)"
  - id: NFR-2
    desc: "Деление на ноль запрещено и должно вызывать исключение"
  - id: NFR-3
    desc: "Все операции работают с целыми числами (int)"

# -----------------------------------------------------------
# МЕТОДЫ МОДУЛЯ С ТРАССИРОВКОЙ ТРЕБОВАНИЙ
# -----------------------------------------------------------
methods:
  # ===== МЕТОД: add =====
  - name: add
    # Привязка к требованиям
    req_functional: ["1"]           # Функц. требование #1: сложение
    req_non_functional: ["NFR-1", "NFR-3"]
    
    # Сигнатура метода
    signature: "int add(int a, int b)"
    
    # Предусловие: что должно быть выполнено ДО вызова
    pre: "a и b — целые числа в диапазоне int"
    
    # Постусловие: что гарантируется ПОСЛЕ вызова
    post: "Возвращает сумму a + b, результат в диапазоне int"
    
    # Классы эквивалентности (граничные случаи)
    equivalence_classes:
      - case: "Положительные числа"
        inputs: [2, 3]
        expected: "5"
        trace: "FR-1, NFR-3"
        
      - case: "Отрицательные числа"
        inputs: [-2, -3]
        expected: "-5"
        trace: "FR-1, NFR-3"
        
      - case: "С нулем"
        inputs: [0, 5]
        expected: "5"
        trace: "FR-1"
        
      - case: "Большие числа (проверка NFR-1)"
        inputs: [1000000, 2000000]
        expected: "3000000"
        trace: "FR-1, NFR-1"

  # ===== МЕТОД: subtract =====
  - name: subtract
    req_functional: ["2"]           # Функц. требование #2: вычитание
    req_non_functional: ["NFR-1", "NFR-3"]
    signature: "int subtract(int a, int b)"
    pre: "a и b — целые числа в диапазоне int"
    post: "Возвращает разность a - b"
    equivalence_classes:
      - case: "Простое вычитание"
        inputs: [5, 3]
        expected: "2"
        trace: "FR-2, NFR-3"
        
      - case: "Результат отрицательный"
        inputs: [3, 5]
        expected: "-2"
        trace: "FR-2, NFR-3"

  # ===== МЕТОД: divide =====
  - name: divide
    req_functional: ["3"]           # Функц. требование #3: деление
    req_non_functional: ["NFR-2", "NFR-3"]
    signature: "double divide(int a, int b)"
    pre: "b != 0 (проверка NFR-2)"
    post: "Возвращает a / b. При b=0 выбрасывает IllegalArgumentException"
    equivalence_classes:
      - case: "Обычное деление"
        inputs: [10, 2]
        expected: "5.0"
        trace: "FR-3, NFR-3"
        
      - case: "Деление с остатком"
        inputs: [7, 2]
        expected: "3.5"
        trace: "FR-3, NFR-3"
        
      - case: "Деление на ноль (проверка NFR-2)"
        inputs: [5, 0]
        expected: "IllegalArgumentException"
        trace: "FR-3, NFR-2"